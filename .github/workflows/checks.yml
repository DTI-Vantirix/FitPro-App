name: Checks

# Every push reruns the API tests, the web lint and the browser flows (admin
# and runner) against a fresh Postgres. A pull request shows the result of the
# push to its branch, so there is no separate pull_request trigger.
on:
  push:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitpro
          POSTGRES_PASSWORD: fitpro
          POSTGRES_DB: fitpro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitpro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://fitpro:fitpro@localhost:5432/fitpro_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: PGPASSWORD=fitpro psql -h localhost -U fitpro -d fitpro -c "create database fitpro_test owner fitpro"
      - name: API tests
        run: npm test
      - name: Web lint
        run: npm run lint
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser flows
        run: npm run e2e
      - name: Keep the browser-test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/.results/html
          retention-days: 14
