# Local Postgres for development: `npm run db:up`
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitpro
      POSTGRES_PASSWORD: fitpro
      POSTGRES_DB: fitpro
    ports:
      - "${FITPRO_DB_PORT:-5432}:5432"
    volumes:
      - fitpro-db:/var/lib/postgresql/data
      - ./server/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitpro"]
      interval: 5s
      retries: 10

volumes:
  fitpro-db:
